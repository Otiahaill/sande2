<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SANDE Control Centre</title>
  <script>
    // Inject API base URL from environment or default
    (() => {
      const apiBase = typeof window !== 'undefined'
        ? (window.__SANDE_API_BASE || '')
        : '';
      if (apiBase) {
        window.__SANDE_API_BASE = apiBase;
      }
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
