name = "sande-backend"
main = "src/index.ts"
compatibility_date = "2026-11-17"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
# The OAuth client id is a public identifier: the backend verifies Google ID
# tokens against Google's public JWKS with it as the audience, so it does not
# need the client secret. It is safe to keep in source control.
GOOGLE_CLIENT_ID = "30937762168-1q32ltfb5co7t0l5763fjn23dv2rtsbq.apps.googleusercontent.com"

[dev]
port = 8787
ip = "127.0.0.1"

[[d1_databases]]
binding = "DB"
database_name = "sande-platform-dev"
database_id = "06f5fadf-8b62-4ddb-9e95-421515291928"

[[r2_buckets]]
binding = "R2_BACKUPS"
bucket_name = "sande-backups-dev"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "32df0f0153674c059656882dd8eeb9c2"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c7bf7ad612d64de5aafc09269023fd1b"

# NOTE: there is no durable object or workflow binding. The scheduled work
# (backups, clean-ups, lease expiry) runs through the cron triggers below
# and `handleScheduled` in src/scheduled.ts. The previous configuration
# declared a `SYNC_COORDINATOR` durable object and a `backup-workflow`
# workflow whose classes do not exist in the Worker source, which made
# `wrangler deploy` fail with
#   The field "workflows" should be an array but got {...}

[observability]
enabled = true

[triggers]
crons = [
  { name = "nightly-backup", schedule = "0 3 * * *" },
  { name = "cleanup-sync-exceptions", schedule = "0 4 * * *" },
  { name = "lease-expiry-check", schedule = "0 */6 * * *" }
]

# Staging environment
[env.staging]
name = "sande-backend-staging"
vars = { ENVIRONMENT = "staging", GOOGLE_CLIENT_ID = "30937762168-1q32ltfb5co7t0l5763fjn23dv2rtsbq.apps.googleusercontent.com" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sande-platform-staging"
database_id = "PLACEHOLDER_STAGING_DB_ID"

[[env.staging.r2_buckets]]
binding = "R2_BACKUPS"
bucket_name = "sande-backups-staging"

[[env.staging.kv_namespaces]]
binding = "SESSION_KV"
id = "PLACEHOLDER_STAGING_SESSION_KV_ID"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "PLACEHOLDER_STAGING_RATE_LIMIT_KV_ID"

# Production environment
[env.production]
name = "sande-backend-prod"
vars = { ENVIRONMENT = "production", GOOGLE_CLIENT_ID = "30937762168-1q32ltfb5co7t0l5763fjn23dv2rtsbq.apps.googleusercontent.com" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "sande-platform-prod"
database_id = "PLACEHOLDER_PROD_DB_ID"

[[env.production.r2_buckets]]
binding = "R2_BACKUPS"
bucket_name = "sande-backups-prod"

[[env.production.kv_namespaces]]
binding = "SESSION_KV"
id = "PLACEHOLDER_PROD_SESSION_KV_ID"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "PLACEHOLDER_PROD_RATE_LIMIT_KV_ID"
